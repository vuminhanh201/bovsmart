
# Server Port
server.port=8081

# Spring Application Name
spring.application.name=bovsmart-jwt-auth

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bovsmart_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# OTP Verification
app.auth.verification.expiration-minutes=10

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# MinIO Object Storage
minio.endpoint=${MINIO_ENDPOINT:http://localhost:8333}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=bovsmart-images

# Image Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Gemini AI
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite

# Qdrant Vector Database
qdrant.base-url=${QDRANT_BASE_URL:http://localhost:6333}
qdrant.collection=bovsmart_knowledge
qdrant.vector-size=768

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB